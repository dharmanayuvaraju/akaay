<head>

  <!-- Video Intro Overlay Critical Styles & CSS-only Failsafe -->
  <style>#akaay-video-overlay{z-index:99999;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;opacity:1;visibility:visible;pointer-events:auto;background-color:#45277c;justify-content:center;align-items:center;transition:opacity .15s cubic-bezier(.4,0,.2,1);animation:2.8s forwards akaayOverlayCssFailsafe;display:flex;position:fixed;inset:0;overflow:hidden}@keyframes akaayOverlayCssFailsafe{0%,99.9%{opacity:1;visibility:visible;pointer-events:auto}to{opacity:0!important;visibility:hidden!important;pointer-events:none!important;display:none!important}}.akaay-video-container{aspect-ratio:1;background-color:#45277c;justify-content:center;align-items:center;width:min(100vw,100svh);max-width:100vw;height:min(100vw,100svh);max-height:100svh;display:flex;position:relative}#akaay-intro-video{-o-object-fit:contain;object-fit:contain;background-color:#45277c;width:100%;height:100%;display:block}#akaay-intro-poster{-o-object-fit:contain;object-fit:contain;pointer-events:none;background-color:#45277c;width:100%;height:100%;display:none;position:absolute;inset:0}@media (prefers-reduced-motion:reduce){#akaay-intro-video{display:none!important}#akaay-intro-poster{display:block!important}#akaay-video-overlay{transition:none!important}}</style>

  <!-- Noscript hiding so overlay cannot trap the page if JS is disabled -->
  <noscript>
    <style>#akaay-video-overlay{opacity:0!important;pointer-events:none!important;display:none!important}</style>
  </noscript>
  <script type="module" crossorigin src="/akaay/assets/index-BCEeeCZk.js"></script>
  <link rel="stylesheet" crossorigin href="/akaay/assets/index-ooUYKUi9.css">
</head>

<body class="bg-ivory text-ink font-sans antialiased min-h-screen selection:bg-terracotta/20 selection:text-terracotta">
  <!-- 2.5-Second Video Launch Intro Overlay (Mounted before app paints) -->
  <div id="akaay-video-overlay" role="dialog" aria-label="Akaay Boutique Introduction" aria-modal="true">
    <div class="akaay-video-container">
      <video
        id="akaay-intro-video"
        autoplay
        muted
        playsinline
        webkit-playsinline
        preload="auto"
      >
        <source src="/akaay/media/akaay-option-2-intro.mp4" type="video/mp4" />
      </video>
      <img
        id="akaay-intro-poster"
        src="/akaay/media/akaay-option-2-poster.jpg"
        alt="Akaay Boutique"
      />
    </div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById('akaay-video-overlay');
      if (!overlay) return;

      var video = document.getElementById('akaay-intro-video');
      var poster = document.getElementById('akaay-intro-poster');
      var isExited = false;
      var playbackStarted = false;

      // Lock document scroll while intro is playing
      var origDocOverflow = document.documentElement.style.overflow;
      var origBodyOverflow = document.body.style.overflow;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';

      function restoreScroll() {
        document.documentElement.style.overflow = origDocOverflow || '';
        document.body.style.overflow = origBodyOverflow || '';
      }

      function showPosterFallback() {
        if (poster && video) {
          poster.style.display = 'block';
          video.style.display = 'none';
        }
      }

      function cleanup() {
        window.removeEventListener('keydown', handleKeydown);
        overlay.removeEventListener('click', handleClick);
        overlay.removeEventListener('touchend', handleClick);
        if (video) {
          video.removeEventListener('playing', onPlaying);
          video.removeEventListener('ended', onEnded);
          video.removeEventListener('error', onError);
        }
        clearTimeout(fadeTimer);
        clearTimeout(removeTimer);
        clearTimeout(hardFailsafeTimer);
        clearTimeout(stallTimer);
        clearTimeout(reducedMotionTimer);
        restoreScroll();
      }

      function exitOverlay(fadeDurationMs) {
        if (isExited) return;
        isExited = true;

        cleanup();

        if (fadeDurationMs > 0) {
          overlay.style.transition = 'opacity ' + fadeDurationMs + 'ms cubic-bezier(0.4, 0, 0.2, 1)';
          overlay.style.opacity = '0';
          overlay.style.pointerEvents = 'none';
          setTimeout(function () {
            if (overlay.parentNode) {
              overlay.parentNode.removeChild(overlay);
            }
          }, fadeDurationMs);
        } else {
          if (overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
          }
        }
      }

      function handleClick(e) {
        if (e && e.preventDefault) e.preventDefault();
        exitOverlay(0); // Instant skip on click/tap
      }

      function handleKeydown(e) {
        if (e.key === 'Escape' || e.keyCode === 27) {
          if (e.preventDefault) e.preventDefault();
          exitOverlay(0); // Instant skip on Escape
        }
      }

      function onPlaying() {
        playbackStarted = true;
      }

      function onEnded() {
        // When video naturally ends, fade during 150ms and remove
        exitOverlay(150);
      }

      function onError() {
        showPosterFallback();
      }

      // Skip event listeners
      overlay.addEventListener('click', handleClick);
      overlay.addEventListener('touchend', handleClick, { passive: false });
      window.addEventListener('keydown', handleKeydown);

      // Resolve relative path if app is deployed on a sub-path like /akaay/
      try {
        var baseElem = document.querySelector('base');
        var basePath = (baseElem && baseElem.getAttribute('href')) || window.location.pathname;
        if (basePath && basePath.indexOf('/akaay') === 0) {
          var prefix = '/akaay';
          if (poster && poster.getAttribute('src') === '/media/akaay-option-2-poster.jpg') {
            poster.setAttribute('src', prefix + '/media/akaay-option-2-poster.jpg');
          }
          var source = video ? video.querySelector('source') : null;
          if (source && source.getAttribute('src') === '/media/akaay-option-2-intro.mp4') {
            source.setAttribute('src', prefix + '/media/akaay-option-2-intro.mp4');
            video.load();
          }
        }
      } catch (pathErr) {}

      // Reduced motion: static poster briefly (700ms), no video or fade
      var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var reducedMotionTimer = null;
      if (prefersReduced) {
        showPosterFallback();
        reducedMotionTimer = setTimeout(function () {
          exitOverlay(0);
        }, 700);
        return;
      }

      // Video setup & autoplay handling: set muted=true before play()
      if (video) {
        video.muted = true;
        video.defaultMuted = true;
        video.addEventListener('playing', onPlaying, { once: true });
        video.addEventListener('ended', onEnded, { once: true });
        video.addEventListener('error', onError, { once: true });

        try {
          var playPromise = video.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(function () {
              showPosterFallback();
            });
          }
        } catch (err) {
          showPosterFallback();
        }
      } else {
        showPosterFallback();
      }

      // 400ms stall check: fallback to static poster if video has not started playing
      var stallTimer = setTimeout(function () {
        if (!playbackStarted && (!video || video.paused || video.currentTime === 0)) {
          showPosterFallback();
        }
      }, 400);

      // Start timing immediately when overlay appears:
      // Fade overlay during the final 150ms (at 2350ms)
      var fadeTimer = setTimeout(function () {
        if (!isExited) {
          overlay.style.transition = 'opacity 150ms cubic-bezier(0.4, 0, 0.2, 1)';
          overlay.style.opacity = '0';
          overlay.style.pointerEvents = 'none';
        }
      }, 2350);

      // Remove overlay at 2500ms
      var removeTimer = setTimeout(function () {
        exitOverlay(0);
      }, 2500);

      // Independent hard failsafe removes overlay unconditionally by 2800ms
      var hardFailsafeTimer = setTimeout(function () {
        exitOverlay(0);
      }, 2800);
    })();
  </script>

  <div id="root"></div>
</body>

</html>
